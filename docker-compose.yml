services:
  cache:
    image: redis:7-alpine
    container_name: ops-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15
    container_name: ops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    container_name: ops-web
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:

      DATABASE_URL: "postgresql://postgres:postgres@db:5432/ops?schema=public"
      REDIS_URL: "redis://cache:6379"
      NODE_ENV: development

    command: >
      sh -c "npm install && 
             npx prisma generate && 
             npx prisma db push && 
             npx prisma db seed && 
             npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
      - ./public/uploads:/app/public/uploads

volumes:
  pgdata: